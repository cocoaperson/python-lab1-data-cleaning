[project]
name = "bird-data-lab"
version = "0.1.0"
description = "Лабораторная работа по очистке GPS данных"
requires-python = "==3.12.14"
dependencies = [
    "pandas==3.0.6",
    "polars==2.0.0",
    "pyarrow==26.0.0",
    "sqlalchemy==2.1.4",
    "psycopg2-binary==2.9.13",
    "python-dotenv==1.2.4",
    "psutil==7.2.2",
    "matplotlib==3.11.2",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
jupyter = "==1.1.1"
ruff = "==0.16.10"
nbclient = "==0.11.0"
nbformat = "==5.11.1"
ipykernel = "==7.4.0"

[tool.ruff]
line-length = 100
target-version = "py312"
